[build]
  # 前端静态文件发布目录
  publish = "public"
  # Netlify Functions 目录
  functions = "netlify/functions"

[functions]
  # Python 函数运行时版本
  runtime = "python3.8"
  # 把根目录的 core.py 一并打包进函数运行环境
  included_files = ["core.py"]

# 把 /api/* 重定向到函数，让前端统一用 /api/xxx 路径
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
